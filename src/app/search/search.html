<div class="filter-bar d-flex align-items-center gap-3 p-3 flex-wrap justify-content-center">

<div class="input-group" style="width: 250px;">
    <button class="btn btn-search" type="button">Search</button>
    <input type="text" class="form-control" />
</div>

<div class="d-flex gap-2 align-items-center">
    <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="monster" />
        <label class="form-check-label" for="monster">Monster</label>
    </div>
    <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="trap" />
        <label class="form-check-label" for="trap">Trap</label>
    </div>
    <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="spell" />
        <label class="form-check-label" for="spell">Spell</label>
    </div>
</div>

<div class="input-group" style="width: 200px;">
    <span class="input-group-text">Damage</span>
    <input type="number" class="form-control" placeholder="ATK" />
</div>

<div class="input-group" style="width: 200px;">
    <span class="input-group-text">Defence</span>
    <input type="number" class="form-control" placeholder="DEF" />
</div>

</div>
