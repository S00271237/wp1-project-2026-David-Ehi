<div class="filter-bar d-flex align-items-center gap-3 p-3 flex-wrap justify-content-center">

<div class="input-group" style="width: 250px;">
    <button class="btn btn-search" type="button" (click)="onSearch()">Search</button>
    <input type="text" class="form-control" id="searchInput" placeholder="Search..." [(ngModel)]="searchInput" />
</div>

<div class="d-flex gap-2 align-items-center">
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="radio" name="cardType" id="all" value="" checked [(ngModel)]="cardType" />
    <label class="form-check-label" for="all">All</label>
  </div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="radio" name="cardType" id="monster" value="Effect+Monster" [(ngModel)]="cardType" />
    <label class="form-check-label" for="monster">Monster</label>
  </div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="radio" name="cardType" id="spell" value="Spell+Card" [(ngModel)]="cardType" />
    <label class="form-check-label" for="spell">Spell</label>
  </div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="radio" name="cardType" id="trap" value="Trap+Card" [(ngModel)]="cardType" />
    <label class="form-check-label" for="trap">Trap</label>
  </div>
</div>

<div class="input-group" style="width: 200px;">
    <span class="input-group-text">Damage</span>
    <input type="number" class="form-control" placeholder="ATK" [(ngModel)]="atkValue" />
</div>

<div class="input-group" style="width: 200px;">
    <span class="input-group-text">Defence</span>
    <input type="number" class="form-control" placeholder="DEF" [(ngModel)]="defValue" />
</div>

</div>
